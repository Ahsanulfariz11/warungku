<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplikasi manajemen warung sembako — kelola produk, stok, kasir, dan laporan penjualan. Bisa diakses online & offline." />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Warung Sembako" />
  
  <title>Warung Sembako — Manajemen Toko</title>
  
  <link rel="manifest" href="manifest.json" />
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>" />
  <script type="module" crossorigin src="/assets/index-BwoMpyoo.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DNb4TvSw.css">
</head>
<body>

  <!-- Login Screen (hidden by default) -->
  <div id="login-screen" class="login-screen" style="display: none;">
    <div class="loading-spinner"><div class="spinner"></div></div>
  </div>

  <div class="app-layout" style="display: flex;">
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-logo"><i data-lucide="store"></i></div>
          <div>
            <div class="sidebar-title">Warung Sembako</div>
            <div class="sidebar-subtitle">Sistem Manajemen Toko</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Menu Utama</div>
          <div class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard" class="nav-icon"></i>
            <span>Dashboard</span>
          </div>
          <div class="nav-item" data-page="products">
            <i data-lucide="package" class="nav-icon"></i>
            <span>Produk</span>
            <span class="nav-badge" id="nav-badge-products" style="display: none;">0</span>
          </div>
          <div class="nav-item" data-page="pos">
            <i data-lucide="shopping-cart" class="nav-icon"></i>
            <span>Kasir</span>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Analisis</div>
          <div class="nav-item" data-page="reports">
            <i data-lucide="trending-up" class="nav-icon"></i>
            <span>Laporan</span>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Pengaturan</div>
          <div class="nav-item" data-page="employees">
            <i data-lucide="users" class="nav-icon"></i>
            <span>Karyawan</span>
          </div>
          <div class="nav-item" data-page="backup">
            <i data-lucide="database" class="nav-icon"></i>
            <span>Backup Data</span>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div id="sidebar-user-info"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="page-header">
        <div>
          <button class="menu-toggle" id="menu-toggle"><i data-lucide="menu"></i></button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
          <p class="page-subtitle" id="page-subtitle">Ringkasan penjualan dan stok warung Anda</p>
        </div>
      </header>

      <div class="page-body" id="page-content">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-item active" data-page="dashboard">
      <i data-lucide="layout-dashboard"></i>
      <span>Beranda</span>
    </div>
    <div class="mobile-bottom-nav-item" data-page="products">
      <i data-lucide="package"></i>
      <span>Produk</span>
    </div>
    <div class="mobile-bottom-scan-wrapper">
      <button class="mobile-bottom-scan-btn" id="btn-mobile-bottom-scan" title="Scan Barcode / QR">
        <i data-lucide="camera"></i>
      </button>
    </div>
    <div class="mobile-bottom-nav-item" data-page="pos">
      <i data-lucide="shopping-cart"></i>
      <span>Kasir</span>
    </div>
    <div class="mobile-bottom-nav-item" id="btn-mobile-bottom-menu">
      <i data-lucide="menu"></i>
      <span>Menu</span>
    </div>
  </nav>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- PWA Install Banner -->
  <div class="pwa-install-banner" id="pwa-install-banner">
    <div class="pwa-install-text">
      <strong>Install Aplikasi</strong><br />
      Akses warung Anda lebih cepat dari home screen!
    </div>
    <button class="btn btn-primary btn-sm" onclick="installPWA()">Install</button>
    <button class="pwa-dismiss" onclick="dismissInstallBanner()">&times;</button>
  </div>

  <!-- Scripts — Bundled by Vite -->

</body>
</html>
